<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>Test Game</title>
        <style>
            body {
                margin: 0;
            }

            #topMiddle {
                display: block;
                background: #ffa4ff;
            }

            #bottom {
                display: block;
                background: #efe78b;
            }
        </style>
    </head>
    <body>

        <canvas id="topMiddle"></canvas>
        <canvas id="bottom"></canvas>

        <script>
            const canvasA = document.getElementById("topMiddle");
            const ctx = canvasA.getContext("2d");

            canvasA.width = window.innerWidth;
            canvasA.height = window.innerHeight * 0.8;

            // ===== 定数 =====
            const OBJECT_SIZE = 60;

            // ===== プレイヤー =====
            const player = {
                x: canvasA.width / 2,
                y: canvasA.height - 100,
                size: OBJECT_SIZE
            };

            // ===== タッチ操作 =====
            window.addEventListener("touchmove", (e) => {
                player.x = e.touches[0].clientX;
            });

            // ===== コメント =====
            const comments = [];

            function spawnComment() {

                comments.push({
                    x: OBJECT_SIZE / 2 + Math.random() * (canvasA.width - OBJECT_SIZE),
                    y: -OBJECT_SIZE,
                    size: OBJECT_SIZE,
                    speed: 5
                });
            }

            // 1秒ごとに生成
            setInterval(spawnComment, 1000);

            // ===== 当たり判定 =====
            function isColliding(a, b) {

                return (
                    Math.abs(a.x - b.x) < (a.size + b.size) / 2 &&
                    Math.abs(a.y - b.y) < (a.size + b.size) / 2
                );
            }

            // ===== 更新 =====
            function update() {

                for (let i = comments.length - 1; i >= 0; i--) {

                    const c = comments[i];

                    // 落下
                    c.y += c.speed;

                    // 当たり判定
                    if (isColliding(player, c)) {

                        comments.splice(i, 1);
                        continue;
                    }

                    // 画面外削除
                    if (c.y - c.size / 2 > canvasA.height) {

                        comments.splice(i, 1);
                    }
                }
            }

            // ===== 描画 =====
            function draw() {

                ctx.clearRect(0, 0, canvasA.width, canvasA.height);

                // プレイヤー
                ctx.fillStyle = "white";

                ctx.fillRect(
                    player.x - player.size / 2,
                    player.y - player.size / 2,
                    player.size,
                    player.size
                );

                // コメント
                ctx.fillStyle = "lime";

                for (const c of comments) {

                    ctx.fillRect(
                        c.x - c.size / 2,
                        c.y - c.size / 2,
                        c.size,
                        c.size
                    );
                }
            }

            // ===== ループ =====
            function gameLoop() {

                update();
                draw();

                requestAnimationFrame(gameLoop);
            }

            gameLoop();
        </script>

    </body>
</html>
